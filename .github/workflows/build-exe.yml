name: Build QuetCamera.exe

on:
  push:
    branches: [quet-camera]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Thử chạy script trên Windows (ping, arp, xuất Excel)
        shell: pwsh
        run: |
          python QuetCamera.py --range 127.0.0.1-3 --user admin --password x --ports 135,445 --timeout 2 --out test_py.xlsx
          if (!(Test-Path test_py.xlsx)) { throw "Không tạo được file Excel" }

      - name: Đóng gói exe
        shell: pwsh
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name QuetCamera QuetCamera.py

      - name: Thử exe chế độ dòng lệnh
        shell: pwsh
        run: |
          $p = Start-Process dist\QuetCamera.exe -ArgumentList '--range 127.0.0.1 --ports 135 --timeout 2 --out test_exe.xlsx' -PassThru -Wait
          if (!(Test-Path test_exe.xlsx)) { throw "exe không xuất được Excel" }

      - name: Thử mở giao diện exe
        shell: pwsh
        run: |
          $p = Start-Process dist\QuetCamera.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Giao diện bị tắt ngay (mã $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          "Giao diện chạy OK"

      - name: Lưu exe vào nhánh quet-camera-exe
        shell: bash
        run: |
          mkdir out && cp dist/QuetCamera.exe out/ && cp HUONG_DAN.txt out/ && cd out
          git init -q -b quet-camera-exe
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "QuetCamera.exe ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" quet-camera-exe
